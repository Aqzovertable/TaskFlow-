<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow — EXADY</title><style>
:root{--bg:#0d1018;--p:#171e2c;--line:#2b354a;--txt:#f2f5fc;--muted:#9aa6bd;--a:#9283ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#29224d,transparent 35%),var(--bg);color:var(--txt);font:15px/1.5 system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:30px 20px}.top,.hero,.head,.foot{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:21px;font-weight:800}.tag,.muted{color:var(--muted);font-size:13px}.hero{margin:35px 0 22px;align-items:end}.hero h1{font-size:clamp(28px,5vw,42px);margin:0;letter-spacing:-1.5px}.hero p{color:var(--muted);margin:5px 0 0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px}.primary{background:linear-gradient(135deg,#a99aff,#7161ee);color:white;font-weight:750}.stats,.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat,.col,.dialog{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:16px}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:26px}.toolbar{display:flex;gap:9px;margin:17px 0}.toolbar input{flex:1}input,select{background:#202a3c;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:11px;min-width:0}.col{background:#111722;min-height:230px}.head{font-weight:700;margin-bottom:12px}.count{color:var(--muted);font-size:12px}.task{background:#202a3b;border:1px solid #303c52;border-radius:11px;padding:12px;margin:8px 0}.task h3{font-size:14px;margin:0 0 5px}.task p{font-size:12px;color:var(--muted);margin:0 0 10px}.taskfoot{display:flex;justify-content:space-between;align-items:center;gap:5px}.pill{font-size:11px;padding:3px 7px;border-radius:20px;background:#383252;color:#d4ccff}.high{background:#492b37;color:#ffb1bf}.low{background:#1d4038;color:#a0e7ce}.actions{display:flex;gap:4px}.actions button{padding:5px 8px;background:#354159;color:white;font-size:12px}.empty{text-align:center;color:#6e7b94;padding:25px 5px}.foot{justify-content:center;color:#71809a;font-size:12px;margin:20px}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:15px}.modal.open{display:grid}.dialog{width:min(420px,100%);padding:22px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%}.right{display:flex;justify-content:end;gap:8px;margin-top:15px}.secondary{background:#303b51;color:white}@media(max-width:700px){.cols{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.stats{gap:7px}.stat{padding:12px}.wrap{padding:22px 13px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">✦ TaskFlow</div><div class="tag">EXADY · DEMO PROJECT</div></header><section class="hero"><div><h1>Планируй. Делай. Повторяй.</h1><p>Компактная Kanban-доска для повседневных задач.</p></div><button class="primary" id="add">＋ Новая задача</button></section><section class="stats"><div class="stat"><span>Всего задач</span><b id="total">0</b></div><div class="stat"><span>В процессе</span><b id="active">0</b></div><div class="stat"><span>Завершено</span><b id="finished">0</b></div></section><div class="toolbar"><input id="search" placeholder="Поиск по задачам…"><select id="filter"><option value="all">Все приоритеты</option><option value="high">Высокий</option><option value="normal">Обычный</option><option value="low">Низкий</option></select></div><section class="cols"><div class="col"><div class="head">К выполнению <span class="count" id="n-todo"></span></div><div id="todo"></div></div><div class="col"><div class="head">В процессе <span class="count" id="n-doing"></span></div><div id="doing"></div></div><div class="col"><div class="head">Готово <span class="count" id="n-done"></span></div><div id="done"></div></div></section><div class="foot">Локальное сохранение · TaskFlow by EXADY</div></main>
<div class="modal" id="modal"><form class="dialog" id="form"><h2 id="formTitle">Новая задача</h2><div class="field"><label>Название</label><input id="title" required maxlength="70" placeholder="Например, обновить сайт"></div><div class="field"><label>Описание</label><input id="desc" maxlength="150" placeholder="Короткое описание"></div><div class="field"><label>Приоритет</label><select id="priority"><option value="normal">Обычный</option><option value="high">Высокий</option><option value="low">Низкий</option></select></div><div class="right"><button type="button" class="secondary" id="cancel">Отмена</button><button class="primary">Сохранить</button></div></form></div>
<script>
const $=s=>document.querySelector(s),KEY='exady-taskflow';let data=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:1,title:'Спланировать релиз',desc:'Подготовить список задач',priority:'high',status:'todo'},{id:2,title:'Собрать прототип',desc:'Проверить мобильную версию',priority:'normal',status:'doing'},{id:3,title:'Оформить README',desc:'Описать запуск проекта',priority:'low',status:'done'}],editing=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function render(){let q=$('#search').value.toLowerCase(),f=$('#filter').value;for(let s of ['todo','doing','done']){let arr=data.filter(t=>t.status===s&&(!q||(t.title+' '+t.desc).toLowerCase().includes(q))&&(f==='all'||t.priority===f));$('#'+s).innerHTML=arr.length?arr.map(t=>`<article class="task"><h3>${esc(t.title)}</h3><p>${esc(t.desc||'Без описания')}</p><div class="taskfoot"><span class="pill ${t.priority}">${({high:'Высокий',normal:'Обычный',low:'Низкий'})[t.priority]}</span><div class="actions"><button data-edit="${t.id}">Изм.</button><button data-next="${t.id}">${s==='todo'?'→':s==='doing'?'✓':'↶'}</button><button data-del="${t.id}">×</button></div></div></article>`).join(''):'<div class="empty">Пока пусто</div>';$('#n-'+s).textContent=data.filter(t=>t.status===s).length}$('#total').textContent=data.length;$('#active').textContent=data.filter(t=>t.status==='doing').length;$('#finished').textContent=data.filter(t=>t.status==='done').length}
function open(t){editing=t?.id||null;$('#formTitle').textContent=t?'Изменить задачу':'Новая задача';$('#title').value=t?.title||'';$('#desc').value=t?.desc||'';$('#priority').value=t?.priority||'normal';$('#modal').classList.add('open');$('#title').focus()}function close(){$('#modal').classList.remove('open')}
$('#add').onclick=()=>open();$('#cancel').onclick=close;$('#search').oninput=render;$('#filter').onchange=render;$('#form').onsubmit=e=>{e.preventDefault();let v={title:$('#title').value.trim(),desc:$('#desc').value.trim(),priority:$('#priority').value};if(editing)Object.assign(data.find(t=>t.id===editing),v);else data.unshift({id:Date.now(),...v,status:'todo'});close();save()};document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let id=Number(b.dataset.edit||b.dataset.next||b.dataset.del),t=data.find(x=>x.id===id);if(!t)return;if(b.dataset.edit)open(t);if(b.dataset.del&&confirm('Удалить задачу?'))data=data.filter(x=>x.id!==id);if(b.dataset.next)t.status=t.status==='todo'?'doing':t.status==='doing'?'done':'todo';save()});$('#modal').onclick=e=>{if(e.target.id==='modal')close()};render();
</script></body></html>
